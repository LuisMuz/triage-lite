[normalize]
chunk_size = 10
min_language_confidence = 0.7

[prompts]
classify = 3
dedupe_judge = 3
summarize = 2

[local_retry]
max_attempts = 4
initial_delay_seconds = 2.0
backoff_rate = 2.0

[dedupe]
top_k = 5
similarity_threshold = 0.30
max_pairs = 400
judge_chunk_size = 10
max_cluster_size = 8

[report]
max_representative_incidents = 15
top_components = 3
percent_decimals = 1
min_data_token_digits = 3
