name: plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "config/**"
      - "prompts/**"
      - "src/**"
      - "scripts/build_lambda.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/plan.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    name: terraform checks and plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.8.22"
          enable-cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: "v0.65.0"

      - name: Install checkov
        run: |
          uv tool install "checkov==3.4.3"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Install tflint plugins
        run: tflint --init --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the Lambda packages the plan hashes
        run: make build

      - name: Initialise without state for the static checks
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/envs/demo init -backend=false

      - name: fmt, validate, tflint and checkov
        run: make infra-check

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan (read-only, no state lock)
        working-directory: infra/envs/demo
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
        run: |
          terraform init -reconfigure
          terraform plan -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Plan in the job summary
        working-directory: infra/envs/demo
        run: |
          {
            echo "## terraform plan: infra/envs/demo"
            echo
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo
            echo '```'
            head -c 800000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
